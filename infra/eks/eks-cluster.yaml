AWSTemplateFormatVersion: "2010-09-09"
Description: Atlas reusable EKS cluster and managed node group

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name such as dev, staging, prod, or prod-dr

  ClusterName:
    Type: String
    Description: EKS cluster name

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the EKS cluster

  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet for EKS worker nodes

  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet for EKS worker nodes

  KubernetesVersion:
    Type: String
    Default: "1.34"

  NodeInstanceType:
    Type: String
    Default: t3.medium

  DesiredNodeCount:
    Type: Number
    Default: 2

  MinNodeCount:
    Type: Number
    Default: 1

  MaxNodeCount:
    Type: Number
    Default: 3

Resources:
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub atlas-${EnvironmentName}-eks-cluster-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Project
          Value: atlas
        - Key: Environment
          Value: !Ref EnvironmentName

  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub atlas-${EnvironmentName}-eks-node-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
      Tags:
        - Key: Project
          Value: atlas
        - Key: Environment
          Value: !Ref EnvironmentName

  EKSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Security group for atlas ${EnvironmentName} EKS cluster
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub atlas-${EnvironmentName}-eks-sg
        - Key: Project
          Value: atlas
        - Key: Environment
          Value: !Ref EnvironmentName

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SecurityGroupIds:
          - !Ref EKSSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Tags:
        - Key: Project
          Value: atlas
        - Key: Environment
          Value: !Ref EnvironmentName

  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Sub atlas-${EnvironmentName}-managed-ng
      NodeRole: !GetAtt EKSNodeRole.Arn
      Subnets:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref DesiredNodeCount
        MinSize: !Ref MinNodeCount
        MaxSize: !Ref MaxNodeCount
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      Tags:
        Project: atlas
        Environment: !Ref EnvironmentName

Outputs:
  ClusterName:
    Value: !Ref EKSCluster

  ClusterArn:
    Value: !GetAtt EKSCluster.Arn

  ClusterEndpoint:
    Value: !GetAtt EKSCluster.Endpoint

  NodeGroupName:
    Value: !Ref EKSNodeGroup

  EKSClusterRoleArn:
    Value: !GetAtt EKSClusterRole.Arn

  EKSNodeRoleArn:
    Value: !GetAtt EKSNodeRole.Arn
