AWSTemplateFormatVersion: "2010-09-09"
Description: Central S3 bucket for AWS CloudTrail organization logs

Parameters:
  EnvironmentName:
    Type: String
    Default: atlas

  OrganizationId:
    Type: String
    Description: AWS Organization ID, for example o-xxxxxxxxxx

Resources:
  CloudTrailLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-cloudtrail-logs-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CloudTrailLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck20150319
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub "arn:aws:s3:::${CloudTrailLogBucket}"

          - Sid: AWSCloudTrailWrite20150319
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource:
              - !Sub "arn:aws:s3:::${CloudTrailLogBucket}/AWSLogs/${AWS::AccountId}/*"
              - !Sub "arn:aws:s3:::${CloudTrailLogBucket}/AWSLogs/${OrganizationId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

Outputs:
  CloudTrailLogBucketName:
    Description: Name of the CloudTrail log bucket
    Value: !Ref CloudTrailLogBucket

  CloudTrailLogBucketArn:
    Description: ARN of the CloudTrail log bucket
    Value: !Sub "arn:aws:s3:::${CloudTrailLogBucket}"
